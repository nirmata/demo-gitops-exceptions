apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter-host-access
  namespace: policy-exceptions
  annotations:
    demo.nirmata.io/approved-by: platform-security
    demo.nirmata.io/justification: >-
      node-exporter is a node-level agent: reading host metrics requires the
      host network, host PID namespace and read-only host mounts. This is an
      accepted deviation for cluster infrastructure, not for tenant workloads.
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: disallow-host-namespaces
    - kind: ValidatingPolicy
      name: disallow-host-path
    - kind: ValidatingPolicy
      name: disallow-host-ports
    - kind: ValidatingPolicy
      name: restrict-volume-types
    - kind: ValidatingPolicy
      name: require-run-as-nonroot

  matchConditions:
    - name: node-exporter-only
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        has(object.metadata.labels) &&
        'app' in object.metadata.labels &&
        object.metadata.labels['app'] == 'node-exporter'
